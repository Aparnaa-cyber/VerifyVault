<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VerifyVault</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<!-- ✅ ALGOSDK -->
<script src="https://cdn.jsdelivr.net/npm/algosdk/dist/browser/algosdk.min.js"></script>

<style>
body{
margin:0;
height:100vh;
font-family:'Poppins';
color:white;
overflow:hidden;
background: radial-gradient(circle at top, #1a2a6c, #000);
}

.stars{
position:absolute;
width:100%;
height:100%;
background:url('https://www.transparenttextures.com/patterns/stardust.png');
opacity:0.2;
animation:moveStars 60s linear infinite;
}

@keyframes moveStars{
from{background-position:0 0;}
to{background-position:1000px 1000px;}
}

.container{
position:relative;
z-index:2;
width:420px;
margin:auto;
top:50%;
transform:translateY(-50%);
padding:35px;
border-radius:20px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);
text-align:center;
}

h1{
font-family:'Orbitron';
font-size:34px;
color:#00eaff;
}

.btn{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
background:linear-gradient(45deg,#ff7b00,#ff00c8);
color:white;
transition:0.3s;
}

.btn:hover{
transform:scale(1.08);
box-shadow:0 0 20px #ff00c8;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid rgba(255,255,255,0.4);
background:rgba(0,0,0,0.4);
color:white;
}

/* popup */
.popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#111827;
padding:30px;
border-radius:15px;
display:none;
text-align:center;
z-index:10;
}

.loader{
border:5px solid rgba(255,255,255,0.2);
border-top:5px solid #00eaff;
border-radius:50%;
width:50px;
height:50px;
animation:spin 1s linear infinite;
margin:auto;
}

@keyframes spin{
100%{transform:rotate(360deg);}
}

.tick{
font-size:60px;
color:#00ffae;
display:none;
animation:pop 0.5s ease;
}

@keyframes pop{
0%{transform:scale(0);}
100%{transform:scale(1);}
}

.hashBox{
display:none;
margin-top:10px;
padding:10px;
background:rgba(255,255,255,0.1);
border-radius:8px;
font-size:12px;
word-break:break-all;
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="container">

<h1>🔐 VerifyVault</h1>

<div id="home">
<button class="btn" onclick="nav('upload')">🚀 Upload Certificate</button>
<button class="btn" onclick="nav('verify')">🔍 Verify Certificate</button>
</div>

<div id="upload" style="display:none;">
<input id="name" placeholder="Student Name">
<input id="roll" placeholder="Register Number">
<input id="certId" placeholder="Certificate ID">
<input type="file" id="fileInput">

<button class="btn" onclick="store()">Store Certificate</button>

<button class="btn" onclick="toggleHash()" id="hashBtn" style="display:none;">👁 Click here for Hash</button>

<div class="hashBox" id="hashBox"></div>
</div>

<div id="verify" style="display:none;">
<input id="searchId" placeholder="Certificate ID">
<input type="file" id="verifyFile">

<button class="btn" onclick="verifyCert()">Verify</button>
</div>

</div>

<!-- popup -->
<div class="popup" id="popup">
<div class="loader" id="loader"></div>
<div class="tick" id="tick">✔</div>
<p id="popupText"></p>
</div>

<script>

let db = {};
let lastHash = "";
let hashVisible = false;

/* ✅ REAL ALGorand Setup */
const algodClient = new algosdk.Algodv2('', 'https://testnet-api.algonode.cloud', '');

// temp account (for demo)
const account = algosdk.generateAccount();

async function storeOnAlgorandReal(hash){
  try{
    const params = await algodClient.getTransactionParams().do();

    const txn = algosdk.makePaymentTxnWithSuggestedParamsFromObject({
      from: account.addr,
      to: account.addr,
      amount: 0,
      note: new TextEncoder().encode(hash),
      suggestedParams: params
    });

    const signedTxn = txn.signTxn(account.sk);
    const tx = await algodClient.sendRawTransaction(signedTxn).do();

    return tx.txId;

  }catch(err){
    console.error(err);
    return "TX_FAILED";
  }
}

/* navigation */
function nav(p){
history.pushState({}, "", "#"+p);
show(p);
}

window.onpopstate=()=>show(location.hash.replace("#","")||"home");

function show(p){
document.getElementById("home").style.display="none";
document.getElementById("upload").style.display="none";
document.getElementById("verify").style.display="none";

if(p==="upload") document.getElementById("upload").style.display="block";
else if(p==="verify") document.getElementById("verify").style.display="block";
else document.getElementById("home").style.display="block";
}

show(location.hash.replace("#","")||"home");

/* popup */
function showPopup(text){
const popup = document.getElementById("popup");
const popupText = document.getElementById("popupText");
const loader = document.getElementById("loader");
const tick = document.getElementById("tick");

popup.style.display="block";
popupText.innerText=text;

loader.style.display="block";
tick.style.display="none";

setTimeout(()=>{
loader.style.display="none";
tick.style.display="block";
},1200);

setTimeout(()=>{
popup.style.display="none";
},3000);
}

/* STORE FUNCTION (REAL BLOCKCHAIN) */
async function store(){

const fileInput = document.getElementById("fileInput");
const certId = document.getElementById("certId");

if(!fileInput.files.length){
showPopup("⚠ Upload file first");
return;
}

if(!certId.value){
showPopup("⚠ Enter Certificate ID");
return;
}

showPopup("Storing on Algorand...");

const reader = new FileReader();

reader.onload = async function(e){

const hash = CryptoJS.SHA256(
CryptoJS.lib.WordArray.create(e.target.result)
).toString();

// 🔥 REAL blockchain call
const txId = await storeOnAlgorandReal(hash);

db[certId.value] = {
hash:hash,
txId:txId
};

lastHash = hash;

setTimeout(()=>{
showPopup("Stored on Algorand ✔\nTX ID: " + txId);
},800);

document.getElementById("hashBtn").style.display="block";

};

reader.readAsArrayBuffer(fileInput.files[0]);
}

/* HASH VIEW */
function toggleHash(){

const hashBox = document.getElementById("hashBox");

hashVisible = !hashVisible;

if(hashVisible){
hashBox.style.display="block";
hashBox.innerText = lastHash;
}else{
hashBox.style.display="none";
}
}

/* VERIFY */
function verifyCert(){

const verifyFile = document.getElementById("verifyFile");
const searchId = document.getElementById("searchId");

if(!verifyFile.files.length){
showPopup("⚠ Upload file");
return;
}

if(!searchId.value){
showPopup("⚠ Enter Certificate ID");
return;
}

showPopup("Verifying...");

const reader = new FileReader();

reader.onload=function(e){

const hash = CryptoJS.SHA256(
CryptoJS.lib.WordArray.create(e.target.result)
).toString();

const cert = db[searchId.value];

setTimeout(()=>{
if(cert && cert.hash === hash){
showPopup("✔ Verified via Algorand\nCertificate Match Found");
}else{
showPopup("❌ Invalid Certificate");
}
},800);

};

reader.readAsArrayBuffer(verifyFile.files[0]);
}

</script>

</body>
</html>
